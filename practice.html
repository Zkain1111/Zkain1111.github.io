<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据分析技术 - 实操练习</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: #f8f9fa;
            color: #2d3748;
        }

        .layout {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            min-height: 100vh;
        }

        /* 左侧题型栏 */
        .sidebar {
            width: 280px;
            background: #fff;
            box-shadow: 0 0 12px rgba(0,0,0,0.05);
            padding: 2rem 1rem;
        }

        .sidebar-title {
            font-size: 1.25rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 1.5rem;
            color: #1a202c;
        }

        .nav-item {
            padding: 1rem 1.2rem;
            margin-bottom: 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-item:hover, .nav-item.active {
            background: #2b6cb0;
            color: white;
        }

        /* 右侧内容 */
        .content {
            flex: 1;
            padding: 2.5rem 3rem;
        }

        .back-btn {
            padding: 0.7rem 1.4rem;
            background: #4a5568;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 1.5rem;
        }

        .back-btn:hover {
            background: #2d3748;
        }

        .title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 2rem;
        }

        /* 实操题目 */
        .exercise {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
        }

        .q-title {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 1rem;
        }

        /* 代码编辑器 */
        textarea {
            width: 100%;
            height: 100px;
            padding: 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;

        }

        /* 运行按钮 */
        .run-btn {
            padding: 0.6rem 1.2rem;

            border-radius: 6px;
            cursor: pointer;
            margin-right: 0.5rem;
        }

        .run-btn:hover {
            background: #235c99;
        }

        /* 运行结果 */
        .output {
            margin-top: 0.8rem;
            padding: 1rem;

            border-radius: 6px;
            font-family: Consolas, monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="layout">
    <!-- 左侧10类实操题型 -->
    <div class="sidebar">
        <div class="sidebar-title">数据分析技术 · 实操题库</div>
        <div class="nav-item active" onclick="show(1)">1. Python 基础运算</div>
        <div class="nav-item" onclick="show(2)">2. 列表与字典操作</div>
        <div class="nav-item" onclick="show(3)">3. Pandas 数据加载</div>
        <div class="nav-item" onclick="show(4)">4. 数据清洗实操</div>
        <div class="nav-item" onclick="show(5)">5. 描述统计实操</div>
        <div class="nav-item" onclick="show(6)">6. 异常值检测</div>
        <div class="nav-item" onclick="show(7)">7. 数据分组与聚合</div>
        <div class="nav-item" onclick="show(8)">8. 数据筛选与过滤</div>
        <div class="nav-item" onclick="show(9)">9. 数据可视化基础</div>
        <div class="nav-item" onclick="show(10)">10. 综合数据分析</div>
    </div>

    <!-- 右侧实操区域 -->
    <div class="content">
        <button class="back-btn" onclick="location.href='index.html'">← 返回首页</button>
        <div class="title" id="main-title">第1类：Python 基础运算</div>
        <div id="container"></div>
    </div>
</div>

<script>
// 10类题型，每类10道可运行代码实操题
const data = [
    // 1 Python基础运算
    [
        { q: "1. 计算 123 + 456", code: "print(123 + 456)" },
        { q: "2. 计算 100 - 58", code: "print(100 - 58)" },
        { q: "3. 计算 25 * 48", code: "print(25 * 48)" },
        { q: "4. 计算 256 / 8", code: "print(256 / 8)" },
        { q: "5. 计算 10的3次方", code: "print(10 ** 3)" },
        { q: "6. 求 125 对 7 取余", code: "print(125 % 7)" },
        { q: "7. 定义 a=10, b=20，输出a+b", code: "a=10\nb=20\nprint(a+b)" },
        { q: "8. 计算圆面积（r=5）", code: "import math\nprint(math.pi * 5**2)" },
        { q: "9. 将字符串'hello'转为大写", code: "print('hello'.upper())" },
        { q: "10. 判断 100 是否大于 99", code: "print(100 > 99)" }
    ],

    // 2 列表字典
    [
        { q: "1. 创建列表 [11,22,33] 并输出", code: "lst = [11,22,33]\nprint(lst)" },
        { q: "2. 获取列表第2个元素", code: "lst = [10,20,30]\nprint(lst[1])" },
        { q: "3. 在列表末尾添加 99", code: "lst = [1,2,3]\nlst.append(99)\nprint(lst)" },
        { q: "4. 创建字典：姓名=小明，年龄=20", code: "d = {'name':'小明','age':20}\nprint(d)" },
        { q: "5. 获取字典中的年龄", code: "d = {'name':'小红','age':21}\nprint(d['age'])" },
        { q: "6. 遍历列表 [3,6,9] 并输出", code: "for i in [3,6,9]:\n    print(i)" },
        { q: "7. 列表长度", code: "print(len([1,2,3,4,5]))" },
        { q: "8. 合并两个列表", code: "a = [1,2]\nb = [3,4]\nprint(a+b)" },
        { q: "9. 判断 5 是否在列表中", code: "print(5 in [1,2,3,4,5])" },
        { q: "10. 字典添加键值对", code: "d = {'a':1}\nd['b']=2\nprint(d)" }
    ],

    // 3 Pandas数据加载
    [
        { q: "1. 导入pandas", code: "import pandas as pd\nprint('导入成功')" },
        { q: "2. 创建简单DataFrame", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2],'b':[3,4]})\nprint(df)" },
        { q: "3. 查看数据前2行", code: "import pandas as pd\ndf = pd.DataFrame({'x':[1,2,3],'y':[4,5,6]})\nprint(df.head(2))" },
        { q: "4. 查看数据信息", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2],'b':[3,4]})\nprint(df.info())" },
        { q: "5. 查看数据形状", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2],'b':[3,4]})\nprint(df.shape)" },
        { q: "6. 查看列名", code: "import pandas as pd\ndf = pd.DataFrame({'name':['a','b'],'age':[1,2]})\nprint(df.columns)" },
        { q: "7. 查看数据类型", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2],'b':['x','y']})\nprint(df.dtypes)" },
        { q: "8. 查看数值列描述", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2,3],'b':[4,5,6]})\nprint(df.describe())" },
        { q: "9. 读取csv（模拟）", code: "import pandas as pd\n# df = pd.read_csv('data.csv')\nprint('模拟读取成功')" },
        { q: "10. 输出全部数据", code: "import pandas as pd\ndf = pd.DataFrame({'x':[10,20],'y':[30,40]})\nprint(df)" }
    ],

    // 4 数据清洗
    [
        { q: "1. 创建含空值数据", code: "import pandas as pd\nimport numpy as np\ndf = pd.DataFrame({'a':[1,np.nan,3],'b':[np.nan,2,3]})\nprint(df)" },
        { q: "2. 查看空值数量", code: "import pandas as pd\nimport numpy as np\ndf = pd.DataFrame({'a':[1,np.nan,3],'b':[4,5,np.nan]})\nprint(df.isnull().sum())" },
        { q: "3. 删除空值行", code: "import pandas as pd\nimport numpy as np\ndf = pd.DataFrame({'a':[1,np.nan,2],'b':[3,4,np.nan]})\nprint(df.dropna())" },
        { q: "4. 用均值填充空值", code: "import pandas as pd\nimport numpy as np\ndf = pd.DataFrame({'a':[1,np.nan,3]})\nprint(df.fillna(df.mean()))" },
        { q: "5. 删除重复行", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,1,2],'b':[3,3,4]})\nprint(df.drop_duplicates())" },
        { q: "6. 替换值", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2,3]})\nprint(df.replace(1,99))" },
        { q: "7. 重置索引", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2,3]}).drop(0)\nprint(df.reset_index(drop=True))" },
        { q: "8. 字段重命名", code: "import pandas as pd\ndf = pd.DataFrame({'old':[1,2]})\nprint(df.rename(columns={'old':'new'}))" },
        { q: "9. 类型转换", code: "import pandas as pd\ndf = pd.DataFrame({'a':['1','2']})\nprint(df['a'].astype(int))" },
        { q: "10. 过滤空值列", code: "import pandas as pd\nimport numpy as np\ndf = pd.DataFrame({'a':[np.nan,np.nan],'b':[1,2]})\nprint(df.dropna(axis=1))" }
    ],

    // 5 描述统计
    [
        { q: "1. 求和", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2,3,4]})\nprint(df.sum())" },
        { q: "2. 求均值", code: "import pandas as pd\ndf = pd.DataFrame({'a':[10,20,30]})\nprint(df.mean())" },
        { q: "3. 求中位数", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2,3,4,5]})\nprint(df.median())" },
        { q: "4. 求最大值", code: "import pandas as pd\ndf = pd.DataFrame({'a':[5,9,3]})\nprint(df.max())" },
        { q: "5. 求最小值", code: "import pandas as pd\ndf = pd.DataFrame({'a':[5,9,3]})\nprint(df.min())" },
        { q: "6. 求标准差", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2,3,4]})\nprint(df.std())" },
        { q: "7. 求方差", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2,3]})\nprint(df.var())" },
        { q: "8. 四分位数", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2,3,4,5,6,7]})\nprint(df.quantile([0.25,0.5,0.75]))" },
        { q: "9. 计数", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2,3,4]})\nprint(df.count())" },
        { q: "10. 整体描述统计", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2,3,4,5],'b':[10,20,30,40,50]})\nprint(df.describe())" }
    ],

    // 6 异常值检测
    [
        { q: "1. 用箱线图原理找异常值", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2,3,4,5,100]})\nQ1 = df.a.quantile(0.25)\nQ3 = df.a.quantile(0.75)\nIQR = Q3-Q1\nprint(df[(df.a < Q1-1.5*IQR) | (df.a > Q3+1.5*IQR)])" },
        { q: "2. 筛选正常值", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2,3,4,5,100]})\nQ1=df.a.quantile(0.25)\nQ3=df.a.quantile(0.75)\nIQR=Q3-Q1\nres = df[(df.a >= Q1-1.5*IQR) & (df.a <= Q3+1.5*IQR)]\nprint(res)" },
        { q: "3. 3σ原则检测", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2,3,4,5,20]})\nmean = df.a.mean()\nstd = df.a.std()\nanomaly = df[(df.a < mean-3*std) | (df.a > mean+3*std)]\nprint(anomaly)" },
        { q: "4. 过滤大于10的值", code: "import pandas as pd\ndf = pd.DataFrame({'a':[5,11,6,12,7]})\nprint(df[df.a <= 10])" },
        { q: "5. 查看最大值最小值", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2,3,4,100]})\nprint('max:',df.a.max(),' min:',df.a.min())" },
        { q: "6. 异常值替换为均值", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2,3,4,50]})\nmean = df.a.mean()\ndf.loc[df.a>10, 'a'] = mean\nprint(df)" },
        { q: "7. 统计异常值数量", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2,3,4,5,100]})\nQ1=df.a.quantile(0.25)\nQ3=df.a.quantile(0.75)\nIQR=Q3-Q1\noutlier = df[(df.a < Q1-1.5*IQR) | (df.a > Q3+1.5*IQR)]\nprint(len(outlier))" },
        { q: "8. 无异常值数据", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2,3,4,5]})\nprint('无异常值')" },
        { q: "9. 按条件标记异常", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2,3,4,50]})\ndf['is_outlier'] = df.a > 10\nprint(df)" },
        { q: "10. 清洗后数据输出", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2,3,4,5,100]})\nQ1=df.a.quantile(0.25)\nQ3=df.a.quantile(0.75)\nIQR=Q3-Q1\ndf_clean = df[(df.a >= Q1-1.5*IQR) & (df.a <= Q3+1.5*IQR)]\nprint(df_clean)" }
    ],

    // 7 分组聚合
    [
        { q: "1. 按列分组求和", code: "import pandas as pd\ndf = pd.DataFrame({'class':['A','A','B'],'score':[80,90,70]})\nprint(df.groupby('class').sum())" },
        { q: "2. 分组求均值", code: "import pandas as pd\ndf = pd.DataFrame({'class':['A','A','B'],'score':[80,90,70]})\nprint(df.groupby('class').mean())" },
        { q: "3. 分组计数", code: "import pandas as pd\ndf = pd.DataFrame({'class':['A','A','B','B'],'val':[1,2,3,4]})\nprint(df.groupby('class').count())" },
        { q: "4. 多列分组", code: "import pandas as pd\ndf = pd.DataFrame({'class':['A','A','B'],'sex':['M','F','M'],'score':[80,90,70]})\nprint(df.groupby(['class','sex']).mean())" },
        { q: "5. 分组最大值", code: "import pandas as pd\ndf = pd.DataFrame({'class':['A','A','B'],'score':[80,90,70]})\nprint(df.groupby('class').max())" },
        { q: "6. 分组最小值", code: "import pandas as pd\ndf = pd.DataFrame({'class':['A','A','B'],'score':[80,90,70]})\nprint(df.groupby('class').min())" },
        { q: "7. 重置分组索引", code: "import pandas as pd\ndf = pd.DataFrame({'class':['A','B'],'val':[1,2]})\nprint(df.groupby('class').sum().reset_index())" },
        { q: "8. 对不同列用不同聚合", code: "import pandas as pd\ndf = pd.DataFrame({'class':['A','A','B'],'a':[1,2,3],'b':[4,5,6]})\nprint(df.groupby('class').agg({'a':'sum','b':'mean'}))" },
        { q: "9. 查看分组对象", code: "import pandas as pd\ndf = pd.DataFrame({'class':['A','A','B'],'val':[1,2,3]})\ng = df.groupby('class')\nfor name,group in g:\n    print(name)\n    print(group)" },
        { q: "10. 分组后筛选", code: "import pandas as pd\ndf = pd.DataFrame({'class':['A','A','B'],'score':[50,60,80]})\nprint(df.groupby('class').filter(lambda x: x['score'].mean() > 55))" }
    ],

    // 8 数据筛选
    [
        { q: "1. 筛选大于5的值", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,6,3,8,5]})\nprint(df[df.a>5])" },
        { q: "2. 多条件筛选", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,6,3,8],'b':[10,20,30,40]})\nprint(df[(df.a>5) & (df.b>25)])" },
        { q: "3. 筛选等于3", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2,3,4,3]})\nprint(df[df.a==3])" },
        { q: "4. 筛选不等于2", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2,3,4]})\nprint(df[df.a!=2])" },
        { q: "5. 包含在列表中", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2,3,4,5]})\nprint(df[df.a.isin([2,4])])" },
        { q: "6. 筛选前N行", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2,3,4,5]})\nprint(df.head(3))" },
        { q: "7. 按索引筛选", code: "import pandas as pd\ndf = pd.DataFrame({'a':[10,20,30]})\nprint(df.loc[1])" },
        { q: "8. 筛选列", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2],'b':[3,4],'c':[5,6]})\nprint(df[['a','c']])" },
        { q: "9. 模糊匹配字符串", code: "import pandas as pd\ndf = pd.DataFrame({'name':['apple','apply','app','banana']})\nprint(df[df.name.str.contains('app')])" },
        { q: "10. 取反筛选", code: "import pandas as pd\ndf = pd.DataFrame({'a':[1,2,3,4]})\nprint(df[~(df.a>2)])" }
    ],

    // 9 可视化基础
    [
        { q: "1. 折线图基础", code: "import pandas as pd\nimport matplotlib.pyplot as plt\ndf = pd.DataFrame({'a':[1,2,3,4],'b':[4,3,2,1]})\ndf.plot(kind='line')\nplt.title('line')\nplt.show()\nprint('折线图已输出')" },
        { q: "2. 柱状图", code: "import pandas as pd\nimport matplotlib.pyplot as plt\ndf = pd.DataFrame({'a':[1,2,3],'b':[4,5,6]})\ndf.plot(kind='bar')\nplt.title('bar')\nplt.show()\nprint('柱状图已输出')" },
        { q: "3. 直方图", code: "import pandas as pd\nimport matplotlib.pyplot as plt\ndf = pd.DataFrame({'data':[1,2,3,3,3,4,4,5]})\ndf['data'].plot(kind='hist')\nplt.title('hist')\nplt.show()\nprint('直方图已输出')" },
        { q: "4. 散点图", code: "import pandas as pd\nimport matplotlib.pyplot as plt\ndf = pd.DataFrame({'x':[1,2,3,4],'y':[2,4,1,3]})\ndf.plot(kind='scatter',x='x',y='y')\nplt.title('scatter')\nplt.show()\nprint('散点图已输出')" },
        { q: "5. 箱线图", code: "import pandas as pd\nimport matplotlib.pyplot as plt\ndf = pd.DataFrame({'a':[1,2,3,4,5,10]})\ndf.plot(kind='box')\nplt.title('box')\nplt.show()\nprint('箱线图已输出')" },
        { q: "6. 饼图", code: "import pandas as pd\nimport matplotlib.pyplot as plt\ns = pd.Series([10,20,30],index=['A','B','C'])\ns.plot(kind='pie')\nplt.title('pie')\nplt.show()\nprint('饼图已输出')" },
        { q: "7. 设置标题", code: "import pandas as pd\nimport matplotlib.pyplot as plt\ndf = pd.DataFrame({'a':[1,2,3]})\ndf.plot()\nplt.title('销售趋势')\nplt.show()\nprint('标题设置成功')" },
        { q: "8. 设置坐标轴", code: "import pandas as pd\nimport matplotlib.pyplot as plt\ndf = pd.DataFrame({'a':[1,2,3]})\ndf.plot()\nplt.xlabel('月份')\nplt.ylabel('销量')\nplt.show()\nprint('坐标轴设置成功')" },
        { q: "9. 多图并列", code: "import pandas as pd\nimport matplotlib.pyplot as plt\ndf = pd.DataFrame({'a':[1,2,3],'b':[3,2,1]})\ndf.plot(subplots=True)\nplt.show()\nprint('多子图输出')" },
        { q: "10. 保存图片", code: "import pandas as pd\nimport matplotlib.pyplot as plt\ndf = pd.DataFrame({'a':[1,2,3]})\ndf.plot()\nplt.savefig('plot.png')\nprint('图片已保存为 plot.png')" }
    ],

    // 10 综合数据分析
    [
        { q: "1. 完整数据分析流程", code: "import pandas as pd\ndf = pd.DataFrame({'name':['A','B','C'],'score':[85,92,78]})\nprint('数据预览')\nprint(df.head())\nprint('\\n描述统计')\nprint(df.describe())" },
        { q: "2. 数据加载+清洗+分析", code: "import pandas as pd\nimport numpy as np\ndf = pd.DataFrame({'a':[1,np.nan,3,4],'b':[5,6,np.nan,8]})\ndf = df.fillna(df.mean())\nprint('清洗完成')\nprint(df)" },
        { q: "3. 分析+可视化", code: "import pandas as pd\nimport matplotlib.pyplot as plt\ndf = pd.DataFrame({'x':[1,2,3,4],'y':[10,20,15,25]})\nprint('均值：', df.mean())\ndf.plot()\nplt.show()\nprint('可视化完成')" },

// 渲染页面
function show(idx) {
    const container = document.getElementById('container');
    const title = document.getElementById('main-title');
    title.innerText = `第${idx}类：${names[idx-1]}`;

    let html = '';
    data[idx-1].forEach((item, i) => {
        html += `
        <div class="exercise">
            <div class="q-title">${item.q}</div>
            <textarea id="code${i}">${item.code}</textarea>
            <button class="run-btn" onclick="run(${i})">运行代码</button>
            <div id="out${i}" class="output"></div>
        </div>`;
    });
    container.innerHTML = html;
}

// 运行代码（模拟Python运行）
function run(i) {
    const code = document.getElementById(`code${i}`).value;
    const out = document.getElementById(`out${i}`);
    out.innerText = "👉 运行结果（模拟环境）：\n" + code + "\n\n✅ 代码可在本地Python环境中直接运行！";
}

// 初始化
show(1);
